services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    ports:
      - "6333:6333" # REST API + web dashboard
      - "6334:6334" # gRPC API
    volumes:
      # Persist collections on the host so they survive container restarts
      - ./qdrant_storage:/qdrant/storage:z
